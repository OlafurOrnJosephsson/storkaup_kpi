<!--
  VIÐSKIPTAVINIR (ný sameinuð síða) — tveir hlutar, á tveimur stöðum.

    A. PAGE HEAD CODE (Page settings → Custom code → Inside <head>):
       STORKAUP_CONFIG + <script src> neðst í þessari skrá.
    B. EMBED í body: AÐEINS <div id="sk-vidskiptavinir"> hér að neðan.

  Síðan er /kpi/vidskiptavinur síðan 2026-10-15 (staging -nyr fékk slóðina,
  gamla síðan var eytt, -nyr 301-ar þangað). /kpi/forgangslisti,
  /kpi/activation og /kpi/emails var eytt sama dag.

  vidskiptavinir.js ver sig gegn tvíræsingu (data-booted á festingunni),
  ólíkt forgangslisti.js. Script-tagið á samt aðeins að vera á EINUM stað.

  Markup og stílar eru smíðaðir í Webflow/vidskiptavinir.js. Embed-ið ber
  ekkert nema festingu, því Webflow-Embed tekur 10.000 stafi og sker
  afganginn þegjandi.

  ── KREFST ──────────────────────────────────────────────────────────
  1. core/sql/vidskiptavinir_v1.sql keyrt í Supabase.
  2. Page-scoped head code, ALDREI site-wide:
       window.STORKAUP_CONFIG.supabaseUrl + .publishableKey
       window.STORKAUP_CONFIG.gasWebAppUrl   (valfrjálst — án þess hverfur
                                              „Senda póst“ hnappurinn)
     Afritaðu STORKAUP_CONFIG-blokkina úr head-kóða /kpi/vidskiptavinur.
     auth.js (site-wide) sér um innskráninguna.

  ── PINNINN ─────────────────────────────────────────────────────────
  <script src> neðst er pinnaður á EIGIN commit, ekki gegnum
  data-storkaup-rev. Breytist Webflow/vidskiptavinir.js: færðu pinnann í
  page head code á síðunni, HÉR, og í pinnatöflunni í CLAUDE.md.
  tools/check-webflow-pins.js les pinnann úr þessari skrá.

  Scriptið keyrir ekki á Designer-canvas. Prófaðu á BIRTU síðunni.
-->
