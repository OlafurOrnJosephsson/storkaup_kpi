<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; }
    .item { padding: 6px; border-bottom: 1px solid #eee; cursor: pointer; }
    .item:hover { background: #f3f3f3; }
    .empty { color: #666; font-size: 12px; padding: 6px 0; }
  </style>
</head>

<body>
 
  <input id="q" placeholder="Sláðu inn inn nafn, kennitölu eda netfang..." />

  <div id="status" class="empty"></div>
  <div id="results"></div>

  <script>
    const input = document.getElementById("q");
    const statusEl = document.getElementById("status");
    const results = document.getElementById("results");
    let lastQuery = "";

    let debounceTimer;
    input.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      const term = input.value.trim();
      debounceTimer = setTimeout(() => {
        lastQuery = term;
        statusEl.textContent = "";
        results.innerHTML = "";

        if (!term) return;

        statusEl.textContent = "Leita...";
        google.script.run
          .withSuccessHandler(list => {
            if (term !== lastQuery) return; // drop stale responses
            render(list);
          })
          .withFailureHandler(err => {
            if (term !== lastQuery) return;
            statusEl.textContent = "Villa: " + (err && err.message ? err.message : "Othekt");
          })
          .searchCustomersUI(term);
      }, 300);
    });

    function render(list) {
      statusEl.textContent = "";
      results.innerHTML = "";

      if (!list || !list.length) {
        statusEl.textContent = "Engar nidurstodur fundust.";
        return;
      }

      list.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = `${item.name} (${item.mode})`;
       div.onclick = () => {
        statusEl.textContent = "Bý til lista...";
        google.script.run
          .withSuccessHandler(() => {
            statusEl.textContent = "Listi búinn til.";
            google.script.host.close();
          })
          .withFailureHandler(err => {
            statusEl.textContent = "Villa: " + (err && err.message ? err.message : "Óþekkt");
            console.error(err);
          })
          .buildShoppingListUI(item.id, item.mode);
      };

        results.appendChild(div);
      });
    }

    input.focus();
  </script>
</body>
</html>
