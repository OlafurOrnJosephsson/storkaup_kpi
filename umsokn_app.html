<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stórkaup — Umsóknir</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "SF Pro Text", -apple-system, Arial, sans-serif;
  font-size: 14px;
  background:transparent;
  color: #282828;
}

/* ── Tabs ── */
.tabs {
  background:transparent;
  border-bottom: 1px solid #e9e9e9;
  padding: 0;
  display: flex;
  gap: 0;
}
.tab {
  padding: 0 1rem;
  min-width:230px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 400;
  display:flex; align-items:center;justify-content: center;
  height: 3rem;
  cursor: pointer;
  font-size: 13px;
  font-weight: 400;
  color: #282828;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: #282828; }
.tab.active { color: #10069f; border-bottom-color: #10069f; font-weight: 700; }
.tab-badge {
  display: inline-block;
  background: #f0f0f0;
  color: #5b5b5b;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
  margin-left: 6px;
}
.tab.active .tab-badge { background: #e8eaff; color: #10069f; }

/* ── Content ── */
.content { padding: 24px 32px; max-width: 1100px; }

/* ── Loading ── */
.loading {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #5b5b5b;
  padding: 40px 0;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid #e9e9e9;
  border-top-color: #10069f;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 48px 0;
  color: #5b5b5b;
}
.empty-icon { font-size: 32px; margin-bottom: 8px; }
.empty p { font-size: 13px; }

/* ── Table ── */
.table-wrap {
  background: #fff;
  border: 1px solid #e9e9e9;
  border-radius: 8px;
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead { background: #fafafa; }
th {
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: #5b5b5b;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid #e9e9e9;
}
td {
  padding: 12px 14px;
  border-bottom: 1px solid #f5f5f5;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr.done td { opacity: 0.4; }

.date-cell { color: #5b5b5b; font-size: 12px; white-space: nowrap; }
.company-cell { font-weight: 600; }
.kt-cell { color: #5b5b5b; font-size: 12px; font-family: monospace; }
.name-cell { }
.email-cell { color: #5b5b5b; font-size: 12px; }
.payment-cell { font-size: 12px; }

/* ── BC badge ── */
.bc-found {
  display: inline-flex; align-items: center; gap: 4px;
  background: #d4edda; color: #155724;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
  white-space: nowrap;
}
.bc-notfound {
  display: inline-flex; align-items: center; gap: 4px;
  background: #fff3cd; color: #856404;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
  white-space: nowrap;
}

/* ── Buttons ── */
.btn {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: #10069f; color: #fff; }
.btn-ghost {
  background: #f5f5f5; color: #282828;
  border: 1px solid #e9e9e9;
}

/* ── Credit score input ── */
.score-input {
  width: 52px;
  padding: 4px 6px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  background: #fff;
}
.score-input:focus { outline: 2px solid #10069f; }
.score-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  margin-top: 4px;
}
.score-red    { background: #f8d7da; color: #721c24; }
.score-yellow { background: #fff3cd; color: #856404; }
.score-green  { background: #d4edda; color: #155724; }

/* ── Template dropdown ── */
.action-cell { white-space: nowrap; }
.template-select {
  font-size: 12px;
  padding: 5px 8px;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  background: #fff;
  color: #282828;
  cursor: pointer;
  margin-right: 6px;
}
.template-select:focus { outline: 2px solid #10069f; }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 10px;
  padding: 28px 32px;
  max-width: 440px;
  width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal h3 { font-size: 16px; margin-bottom: 12px; }
.modal p { color: #444; line-height: 1.6; margin-bottom: 6px; font-size: 13px; }
.modal-info {
  background: #f5f6ff;
  border: 1px solid #e9e9e9;
  border-radius: 6px;
  padding: 10px 14px;
  margin: 14px 0;
  font-size: 13px;
}
.modal-info strong { display: block; font-size: 14px; margin-bottom: 2px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: #282828;
  color: #fff;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.25s;
  z-index: 200;
  max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #c23340; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="rafraen" onclick="switchTab('rafraen')">
    Rafræn Innskráning <span class="tab-badge" id="badge-rafraen">0</span>
  </div>
  <div class="tab" data-tab="umsokn" onclick="switchTab('umsokn')">
    Umsókn um viðskipti <span class="tab-badge" id="badge-umsokn">0</span>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Sæki umsóknir og athugar BC stöðu…</span>
  </div>

  <div id="tab-rafraen"     class="tab-content" style="display:none;"></div>
  <div id="tab-umsokn"      class="tab-content" style="display:none;"></div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Staðfesta</h3>
    <p id="modal-desc"></p>
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Hætta við</button>
      <button class="btn btn-primary" id="modal-confirm">Senda</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var appData = null;

// ── Helpers ────────────────────────────────────────────────────────────────

function run(fn, args) {
  return new Promise(function(resolve, reject) {
    var call = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    call[fn].apply(call, args || []);
  });
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return iso.substring(8,10) + '.' + iso.substring(5,7) + '.' + iso.substring(2,4);
}

// ── Tabs ───────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.style.display = c.id === 'tab-' + name ? '' : 'none';
  });
}

// ── Load data ──────────────────────────────────────────────────────────────

function loadData() {
  run('webapp_getApplications').then(function(data) {
    appData = data;
    document.getElementById('loading').style.display = 'none';
    renderRafraen(data.rafraen || []);
    renderUmsokn(data.umsokn  || []);
    document.getElementById('tab-rafraen').style.display = '';
  }).catch(function(err) {
    document.getElementById('loading').innerHTML =
      '<span style="color:#c23340;">Villa við að sækja gögn: ' + (err.message || err) + '</span>';
  });
}

// ── Render Rafræn ──────────────────────────────────────────────────────────

function renderRafraen(rows) {
  document.getElementById('badge-rafraen').textContent = rows.length;
  var el = document.getElementById('tab-rafraen');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Rafræn Innskráningu.</p></div>';
    return;
  }
  var html = '<div class="table-wrap"><table>'
    + '<thead><tr><th>Dags.</th><th>Fyrirtæki</th><th>Kennitala</th><th>Nafn</th><th>Netfang</th><th>BC staða</th><th>Aðgerð</th></tr></thead><tbody>';
  rows.forEach(function(r, i) {
    html += '<tr id="raf-row-' + i + '">'
      + '<td class="date-cell">' + fmtDate(r.date) + '</td>'
      + '<td class="company-cell">' + esc(r.company) + '</td>'
      + '<td class="kt-cell">' + esc(r.companyKt) + '</td>'
      + '<td class="name-cell">' + esc(r.name) + '</td>'
      + '<td class="email-cell">' + esc(r.email) + '</td>'
      + '<td>' + bcBadge(r.bcFound) + '</td>'
      + '<td class="action-cell">'
      + '<button class="btn btn-primary" onclick="confirmRafraen(' + i + ')">Senda redirect</button>'
      + '</td></tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

function confirmRafraen(i) {
  var r = appData.rafraen[i];
  openModal(
    'Senda redirect póst',
    'Sendir á umsækjanda og flytur línu í "Framsent" flipa.',
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run('webapp_sendRafraenRedirect', [{ rowIndex: r.rowIndex, email: r.email, name: r.name, company: r.company }])
        .then(function() {
          document.getElementById('raf-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('raf-row-' + i).remove();
            var left = document.querySelectorAll('#tab-rafraen tbody tr:not(.done)').length;
            document.getElementById('badge-rafraen').textContent = left;
          }, 600);
          showToast('Redirect póst sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Render Umsókn ──────────────────────────────────────────────────────────

function renderUmsokn(rows) {
  document.getElementById('badge-umsokn').textContent = rows.length;
  var el = document.getElementById('tab-umsokn');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Umsókn um viðskipti.</p></div>';
    return;
  }
  var html = '<div class="table-wrap"><table>'
    + '<thead><tr><th>Dags.</th><th>Fyrirtæki</th><th>Nafn</th><th>Greiðsla</th><th>BC staða</th><th>Skor</th><th>Aðgerð</th></tr></thead><tbody>';
  rows.forEach(function(r, i) {
    html += '<tr id="ums-row-' + i + '">'
      + '<td class="date-cell">' + fmtDate(r.date) + '</td>'
      + '<td>'
        + '<div class="company-cell">' + esc(r.company) + '</div>'
        + '<a href="https://www.skatturinn.is/fyrirtaekjaskra/leit/kennitala/' + esc(r.companyKt) + '" target="_blank" style="font-size:11px;color:#10069f;font-family:monospace;text-decoration:none;">' + esc(r.companyKt) + '</a>'
        + '<div style="font-size:11px;color:#5b5b5b;">' + esc(r.email) + '</div>'
        + (r.phone ? '<div style="font-size:11px;color:#5b5b5b;">' + esc(r.phone) + '</div>' : '')
      + '</td>'
      + '<td class="name-cell">'
        + '<div>' + esc(r.name) + '</div>'
        + (r.personKt ? '<div style="font-size:11px;color:#888;font-family:monospace;">' + esc(r.personKt) + '</div>' : '')
      + '</td>'
      + '<td class="payment-cell">' + paymentBadge(r.payment) + '</td>'
      + '<td>'
        + bcBadge(r.bcFound)
        + (isPersonalKt(r.companyKt) ? '<br><span style="display:inline-block;margin-top:4px;background:#fff3cd;color:#856404;font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;">Einstaklingur</span>' : '')
      + '</td>'
      + '<td style="white-space:nowrap;">'
        + '<input class="score-input" id="score-' + i + '" type="number" min="1" max="10" placeholder="1-10" value="' + esc(r.creditScore) + '" onchange="onScoreChange(' + i + ')" />'
        + '<div id="score-badge-' + i + '">' + scoreBadge(r.creditScore) + '</div>'
      + '</td>'
      + '<td class="action-cell">'
        + (r.bcFound
          ? '<button class="btn btn-ghost" onclick="confirmDone(' + i + ')">✓ Klárað</button>'
          : '<select class="template-select" id="tmpl-' + i + '">'
            + '<option value="">Velja…</option>'
            + '<option value="1">1 — Ekkert VSK-númer</option>'
            + '<option value="2" ' + (isPersonalKt(r.companyKt) ? 'selected' : '') + '>2 — Þarf lánshæfismat</option>'
            + '<option value="3">3 — Staðgreiðsla einungis</option>'
            + '</select>'
            + '<button class="btn btn-primary" onclick="confirmUmsokn(' + i + ')">Senda</button>'
          )
      + '</td></tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}


function confirmDone(i) {
  var r = appData.umsokn[i];
  openModal(
    'Merkja sem klárað',
    'Viðkomandi er þegar til í BC. Þetta merkir línuna sem kláraða án þess að senda tölvupóst.',
    '<strong>' + esc(r.company || r.email) + '</strong>' + (r.companyKt ? '<br><span style="font-size:12px;color:#5b5b5b;">' + esc(r.companyKt) + '</span>' : ''),
    function() {
      run('webapp_markUmsokn_Done', [{ rowIndex: r.rowIndex }])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          showToast(esc(r.company || r.email) + ' merkt sem klárað');
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    },
    'Klárað'
  );
}

function confirmUmsokn(i) {
  var r = appData.umsokn[i];
  var sel = document.getElementById('tmpl-' + i);
  var tmpl = Number(sel.value);
  if (!tmpl) { showToast('Veldu template áður en þú sendir.', true); return; }
  var labels     = ['', 'Ekkert VSK-númer (hafnað)', 'Þarf lánshæfismat', 'Staðgreiðsla einungis'];
  var archiveIds = ['', 'novsk', 'needscredit', 'cashonly'];
  openModal(
    'Senda email — ' + labels[tmpl],
    'Sendir template ' + tmpl + ' á umsækjanda og flytur í "' + labels[tmpl] + '" flipa.',
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run('webapp_sendUmsokn_Email', [{ rowIndex: r.rowIndex, email: r.email, name: r.name }, tmpl])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('ums-row-' + i).remove();
            appData.umsokn[i]._done = true;
            var left = appData.umsokn.filter(function(x) { return x && !x._done; }).length;
            document.getElementById('badge-umsokn').textContent = left;
            }, 600);
          appData.umsokn.forEach(function(x) { if (x && x.rowIndex > r.rowIndex) x.rowIndex--; });
          showToast('Póstur sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Badges ─────────────────────────────────────────────────────────────────

function isPersonalKt(kt) {
  var s = String(kt).replace(/[^0-9]/g, '');
  return s.length === 10 && parseInt(s.substring(0, 2), 10) <= 31;
}

function scoreBadge(val) {
  var n = parseInt(val);
  if (!n || isNaN(n)) return '';
  if (n >= 6)  return '<span class="score-badge score-red">'    + n + '/10 — Staðgreiðsla</span>';
  if (n >= 4)  return '<span class="score-badge score-yellow">' + n + '/10 — Takmörkuð heimild</span>';
  return              '<span class="score-badge score-green">'  + n + '/10 — Heimild samþykkt</span>';
}

function onScoreChange(i) {
  var r   = appData.umsokn[i];
  var val = document.getElementById('score-' + i).value.trim();
  var n   = parseInt(val);

  // Update badge
  document.getElementById('score-badge-' + i).innerHTML = scoreBadge(val);

  // Auto-suggest template 3 if score 6-10
  if (n >= 6) {
    var sel = document.getElementById('tmpl-' + i);
    if (sel) sel.value = '3';
  }

  // Save to sheet
  if (val !== '') {
    run('webapp_saveCreditScore_', [r.rowIndex, val])
      .catch(function(e) { showToast('Villa við vistun skors: ' + (e.message || e), true); });
  }
}

function bcBadge(found) {
  return found
    ? '<span class="bc-found">✓ Til í BC — má stofna</span>'
    : '<span class="bc-notfound">— Ekki til</span>';
}

function paymentBadge(p) {
  if (!p) return '—';
  if (p.toLowerCase().indexOf('reiknings') >= 0)
    return '<span style="background:#e8eaff;color:#10069f;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;">Reikningur</span>';
  return '<span style="background:#f0f0f0;color:#555;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;">' + esc(p) + '</span>';
}

// ── Modal ──────────────────────────────────────────────────────────────────

var _modalCb = null;

function openModal(title, desc, info, cb, confirmLabel) {
  _modalCb = cb;
  document.getElementById('modal-title').textContent   = title;
  document.getElementById('modal-desc').textContent    = desc;
  document.getElementById('modal-info').innerHTML      = info;
  document.getElementById('modal-confirm').textContent = confirmLabel || 'Senda';
  document.getElementById('modal-confirm').onclick     = function() { closeModal(); cb(); };
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  _modalCb = null;
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Util ───────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ───────────────────────────────────────────────────────────────────

loadData();
</script>
</body>
</html>
