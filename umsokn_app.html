<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stórkaup — Umsóknir</title>
<style>
/* ── Brand tokens — speglar Webflow brand (--blue=#10069f o.s.frv.).
   Breyttu þema HÉR á einum stað. ── */
:root {
  --sk-blue:    #10069f;   /* Webflow --blue */
  --sk-blue-bg: #e8eaff;   /* blár blær (badge/pill bakgrunnur) */
  --sk-border:  #e9e9e9;   /* Webflow --light-gray-border */
  --sk-text:    #282828;   /* Webflow --black */
  --sk-muted:   #5b5b5b;   /* Webflow --black-700 */
  --sk-font:    "SF Pro Text", -apple-system, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sk-font);
  font-size: 14px;
  background:transparent;
  color: var(--sk-text);
}

/* ── Tabs ── */
.tabs {
  background:transparent;
  border-bottom: 1px solid var(--sk-border);
  padding: 0;
  display: flex;
  gap: 0;
}
.tab {
  padding: 0 1rem;
  min-width: 160px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 400;
  display:flex; align-items:center;justify-content: center;
  height: 3rem;
  cursor: pointer;
  font-size: .875rem;
  font-weight: 400;
  color: var(--sk-text);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: var(--sk-text); }
.tab.active { color: var(--sk-blue); border-bottom-color: var(--sk-blue); font-weight: 700; }
.tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #f0f0f0;
  color: var(--sk-muted);
  font-size: 0.625rem;
  font-weight: 600;
  height: 1.25rem;
  width: 1.25rem;
  border-radius: 50%;
  margin-left: 6px;
  vertical-align: middle;
}
.tab.active .tab-badge { background: var(--sk-blue-bg); color: var(--sk-blue); }

/* ── Content ── */
.content { padding: 24px 0px; }

/* ── Loading ── */
.loading {
  display: flex;
  align-items: center;
  gap: .75rem;
  color: var(--sk-muted);
  padding: 3rem 0;
}
.spinner {
  width: 1.5rem; height:1.5rem;
  border: 2px solid var(--sk-border);
  border-top-color: var(--sk-blue);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 48px 0;
  color: var(--sk-muted);
}
.empty-icon { font-size: 32px; margin-bottom: 8px; }
.empty p { font-size: 13px; }

/* ── Cards ── rows render as cards at ALL widths (no visual table).
   Label comes from td[data-label]; desktop = "label | value" grid, mobile stacks. */
.card {                          /* one application = one card */
  border: 1px solid var(--sk-border);
  border-radius: 0.75rem;
  background: #fff;
  margin-bottom: 0.875rem;
  padding: 0.875rem 1.125rem;
  box-shadow: 0 1px 4px rgba(16, 6, 159, 0.06);
}
.card.done { opacity: 0.4; }

.fld {
  display: grid;
  grid-template-columns: 10rem 1fr;   /* label | value */
  gap: 0.75rem;
  align-items: start;
  padding: 0.5rem 0;
  border-bottom: 1px solid #f2f2f2;
}
.fld:first-child { padding-top: 0; }
.fld:last-child  { border-bottom: none; padding-bottom: 0; }
.fld::before {
  content: attr(data-label);
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: #98a2b3;
}

.date-cell { color: var(--sk-muted); font-size: .625rem; white-space: nowrap; }
.company-cell { font-weight: 600; font-size: .9375rem; }
.kt-cell { color: var(--sk-muted); font-size: .625rem; font-family: monospace; }
.name-cell { }
.email-cell { color: var(--sk-muted); font-size: .625rem; }
.payment-cell { font-size: 12px; }

/* ── BC badge ── */
.bc-found {
  display: inline-flex; align-items: center; gap: 4px;
  background: #d4edda; color: #155724;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
  white-space: nowrap;
}
.bc-notfound {
  display: inline-flex; align-items: center; gap: 4px;
  background: #fff3cd; color: #856404;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 4px;
  white-space: nowrap;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  flex-direction:row;
  align-items: center;
  height: 2.5rem;
  padding: 0 1rem;
  border-radius: .5rem;
  font-size: .75rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: opacity 0.3s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--sk-blue); color: #fff; }
.btn-ghost {
  background: #f5f5f5; color: var(--sk-text);
  border: 1px solid var(--sk-border);
}

/* ── Credit score input ── */
.score-input {
  width: 58px;
  padding: 4px 6px;
  border: 1px solid var(--sk-border);
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  background: #fff;
}
.score-input:focus { outline: 2px solid var(--sk-blue); }
.score-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  margin-top: 4px;
}
.score-red    { background: #f8d7da; color: #721c24; }
.score-yellow { background: #fff3cd; color: #856404; }
.score-green  { background: #d4edda; color: #155724; }

/* ── Template dropdown ── */
.action-cell { white-space: nowrap; }
.template-select {
  font-size: 12px;
  padding: 5px 8px;
  border: 1px solid var(--sk-border);
  border-radius: 6px;
  background: #fff;
  color: var(--sk-text);
  cursor: pointer;
  margin-right: 6px;
}
.template-select:focus { outline: 2px solid var(--sk-blue); }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 10px;
  padding: 28px 32px;
  max-width: 440px;
  width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal h3 { font-size: 16px; margin-bottom: 12px; }
.modal p { color: #444; line-height: 1.6; margin-bottom: 6px; font-size: 13px; }
.modal-info {
  background: #f5f6ff;
  border: 1px solid var(--sk-border);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 14px 0;
  font-size: 13px;
}
.modal-info strong { display: block; font-size: 14px; margin-bottom: 2px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--sk-text);
  color: #fff;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.25s;
  z-index: 200;
  max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #c23340; }

/* ── BC badge variants ── */
.bc-web-inactive { background: #fff3cd; color: #856404; }
.bc-web-active   { background: #d4edda; color: #155724; }

/* ── Cell sub-content, badges, header (used by the generated rows) ── */
.cell-sub       { font-size: .625rem; color: var(--sk-muted); }
.cell-sub-mt    { font-size: .625rem; color: var(--sk-muted); margin-top: 4px; }
.cell-kt        { font-size: .625rem; color: var(--sk-blue); font-family: monospace; text-decoration: none; }
.cell-kt-muted  { font-size: .625rem; color: #888; font-family: monospace; }
.badge-person   { display: inline-block; margin-top: 4px; background: #fff3cd; color: #856404; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
.pay-badge      { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.pay-badge--acc  { background: var(--sk-blue-bg); color: var(--sk-blue); }
.pay-badge--cash { background: #f0f0f0; color: #555; }
.score-cell     { white-space: nowrap; }
.err-text       { color: #c23340; }

.app-header           { border-bottom: 1px solid var(--sk-border); background: #fff; }
.app-header__row      { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-right: 16px; }
.app-header .tabs     { border-bottom: none; flex: 1; min-width: 0; }
.app-header__actions  { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.refresh-status       { font-size: 11px; color: #888; }

/* ── Mobile: header stacks, cards go single-column ── */
@media (max-width: 768px) {
  .content { padding: 0.75rem; }

  /* Header stacks: tabs full width, actions in a row below */
  .app-header__row { flex-direction: column; align-items: stretch; gap: 0; padding-right: 0; }
  .app-header .tabs { width: 100%; }
  .tab {
    min-width: 0; flex: 1 1 0;
    font-size: 0.8rem; line-height: 1.2;
    padding: 0.5rem 0.375rem; height: auto; min-height: 3rem;
    text-align: center;
  }
  .tab .tab-badge { margin-left: 0.3rem; }
  .app-header__actions { justify-content: flex-end; gap: 0.5rem; padding: 0.5rem 0.125rem 0.625rem; flex-wrap: wrap; }
  .refresh-status { margin-right: auto; }

  .hide-mobile { display: none !important; }

  /* Cards: label stacks above value on narrow screens */
  .fld { grid-template-columns: 1fr; gap: 0.25rem; }
  .fld::before { margin-bottom: 0.25rem; }

  /* Action controls fill the width, comfy tap targets */
  .action-cell .template-select { width: 100%; max-width: none; margin: 0 0 0.5rem; height: 2.625rem; font-size: 0.875rem; }
  .action-cell .btn { width: 100%; font-size: 0.875rem; }
  .score-input { width: 4rem; height: 2.375rem; font-size: 0.875rem; }
}
</style>
</head>
<body>

<div class="app-header">
  <div class="app-header__row">
    <div class="tabs">
      <div class="tab" data-tab="rafraen" onclick="switchTab('rafraen')">
        Rafræn Innskráning <span class="tab-badge" id="badge-rafraen">0</span>
      </div>
      <div class="tab active" data-tab="umsokn" onclick="switchTab('umsokn')">
        Umsókn um viðskipti <span class="tab-badge" id="badge-umsokn">0</span>
      </div>
    </div>
    <div class="app-header__actions">
      <span id="refresh-status" class="refresh-status"></span>
      <button class="btn btn-ghost" id="refresh-btn" onclick="loadData(false)">↻</button>
      <button class="btn btn-ghost" id="sync-btn" onclick="syncMagento()">⟳ Samstilla</button>
    </div>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Sæki umsóknir og athugar BC stöðu…</span>
  </div>

  <div id="tab-rafraen"     class="tab-content" style="display:none;"></div>
  <div id="tab-umsokn"      class="tab-content" style="display:none;"></div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Staðfesta</h3>
    <p id="modal-desc"></p>
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Hætta við</button>
      <button class="btn btn-primary" id="modal-confirm">Senda</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var appData = null;

// ── Helpers ────────────────────────────────────────────────────────────────

function run(fn, args) {
  return new Promise(function(resolve, reject) {
    var call = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    call[fn].apply(call, args || []);
  });
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return iso.substring(8,10) + '.' + iso.substring(5,7) + '.' + iso.substring(2,4);
}

// ── Tabs ───────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.style.display = c.id === 'tab-' + name ? '' : 'none';
  });
}

// Re-apply the currently active tab — used after (re)rendering so a refresh/poll
// keeps the tabs separated instead of showing both tab contents at once.
function applyActiveTab() {
  var t = document.querySelector('.tab.active');
  switchTab(t ? t.dataset.tab : 'umsokn');
}

// ── Load data ──────────────────────────────────────────────────────────────

var lastDataSig = null;   // signature of last rendered data — skip re-render when unchanged
var busy = false;         // a long op (Magento sync) is running — pause polling

function fmtClock(d) {
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function setRefreshStatus(text) {
  var el = document.getElementById('refresh-status');
  if (el) el.textContent = text || '';
}

// silent=true → background poll: no spinner, and only re-render if the data
// actually changed (avoids flicker / scroll jumps while the user is reading).
// Tell the embedding Webflow page the current pending total so the nav badge
// updates instantly (no refresh). Reads the live tab badges — accurate after
// both a data load and an optimistic action removal.
function notifyParentPending() {
  try {
    if (!window.parent || window.parent === window) return;
    var raf = parseInt((document.getElementById('badge-rafraen') || {}).textContent, 10) || 0;
    var ums = parseInt((document.getElementById('badge-umsokn') || {}).textContent, 10) || 0;
    window.parent.postMessage({ type: 'storkaup:pending', total: raf + ums }, '*');
  } catch (e) {}
}

function loadData(silent) {
  if (!silent) document.getElementById('loading').style.display = '';
  setRefreshStatus(silent ? '' : 'Sæki…');
  return run('webapp_getApplications').then(function(data) {
    var sig = JSON.stringify(data);
    var changed = sig !== lastDataSig;
    lastDataSig = sig;
    appData = data;
    document.getElementById('loading').style.display = 'none';
    if (changed || !silent) {
      renderRafraen(data.rafraen || []);
      renderUmsokn(data.umsokn  || []);
    }
    applyActiveTab();
    setRefreshStatus('Uppfært ' + fmtClock(new Date()));
    if (silent && changed) showToast('Listinn uppfærður — nýjar/breyttar umsóknir');
    notifyParentPending();
  }).catch(function(err) {
    if (!silent) {
      document.getElementById('loading').innerHTML =
        '<span class="err-text">Villa við að sækja gögn: ' + (err.message || err) + '</span>';
    }
    setRefreshStatus('Villa við uppfærslu');
  });
}

// ── Render Rafræn ──────────────────────────────────────────────────────────

function renderRafraen(rows) {
  document.getElementById('badge-rafraen').textContent = rows.length;
  var el = document.getElementById('tab-rafraen');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Rafræn Innskráningu.</p></div>';
    return;
  }
  var html = '<div class="card-list">';
  rows.forEach(function(r, i) {
    html += '<div class="card" id="raf-row-' + i + '">'
      + '<div class="fld date-cell hide-mobile" data-label="Dags.">' + fmtDate(r.date) + '</div>'
      + '<div class="fld" data-label="Fyrirtæki">'
        + '<div class="company-cell">' + esc(r.company) + '</div>'
        + (r.companyKt ? '<a href="https://www.skatturinn.is/fyrirtaekjaskra/leit/kennitala/' + esc(r.companyKt) + '" target="_blank" class="cell-kt">' + esc(r.companyKt) + '</a>' : '')
      + '</div>'
      + '<div class="fld name-cell" data-label="Nafn">'
        + '<div>' + esc(r.name) + '</div>'
        + (r.personKt ? '<div class="cell-kt-muted">' + esc(r.personKt) + '</div>' : '')
      + '</div>'
      + '<div class="fld email-cell" data-label="Netfang">'
        + esc(r.email)
        + (r.phone ? '<div class="cell-sub">' + esc(r.phone) + '</div>' : '')
      + '</div>'
      + '<div class="fld" data-label="BC staða">' + bcBadge(r.bcFound, r.bcWebshopActive) + '</div>'
      + '<div class="fld action-cell" data-label="Aðgerð">'
      + '<select class="template-select" id="raf-tmpl-' + i + '">'
        + '<option value="">Velja…</option>'
        + '<option value="redirect">Senda redirect</option>'
        + '<option value="needkt">Vantar persónulega kt</option>'
        + '</select>'
      + '<button class="btn btn-primary" onclick="confirmRafraen(' + i + ')">Senda</button>'
      + '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function confirmRafraen(i) {
  var r = appData.rafraen[i];
  var sel = document.getElementById('raf-tmpl-' + i);
  var action = sel ? sel.value : '';
  if (!action) { showToast('Veldu aðgerð áður en þú sendir.', true); return; }

  var ACTIONS = {
    redirect: {
      fn: 'webapp_sendRafraenRedirect',
      title: 'Senda redirect póst',
      desc: 'Sendir á umsækjanda og flytur línu í "Framsent" flipa.'
    },
    needkt: {
      fn: 'webapp_sendRafraenNeedKt',
      title: 'Vantar persónulega kennitölu',
      desc: 'Sendir póst sem biður umsækjanda að skrá sig aftur með persónulegri kennitölu, og flytur línu í "Vantar kennitölu" flipa.'
    }
  };
  var a = ACTIONS[action];
  if (!a) return;

  openModal(
    a.title,
    a.desc,
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run(a.fn, [{ rowIndex: r.rowIndex, email: r.email, name: r.name, company: r.company }])
        .then(function() {
          document.getElementById('raf-row-' + i).classList.add('done');
          setTimeout(function() {
            var el = document.getElementById('raf-row-' + i);
            if (el) el.remove();
            var left = document.querySelectorAll('#tab-rafraen .card:not(.done)').length;
            document.getElementById('badge-rafraen').textContent = left;
            notifyParentPending();
          }, 600);
          showToast('Póstur sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Render Umsókn ──────────────────────────────────────────────────────────

function renderUmsokn(rows) {
  document.getElementById('badge-umsokn').textContent = rows.length;
  var el = document.getElementById('tab-umsokn');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Umsókn um viðskipti.</p></div>';
    return;
  }
  var html = '<div class="card-list">';
  rows.forEach(function(r, i) {
    html += '<div class="card" id="ums-row-' + i + '">'
      + '<div class="fld date-cell hide-mobile" data-label="Dags.">' + fmtDate(r.date) + '</div>'
      + '<div class="fld" data-label="Fyrirtæki">'
        + '<div class="company-cell">' + esc(r.company) + '</div>'
        + '<a href="https://www.skatturinn.is/fyrirtaekjaskra/leit/kennitala/' + esc(r.companyKt) + '" target="_blank" class="cell-kt">' + esc(r.companyKt) + '</a>'
        + (r.companyEmail ? '<div class="cell-sub">' + esc(r.companyEmail) + '</div>' : '')
        + ((r.address || r.city) ? '<div class="cell-sub">' + esc([r.address, r.city, r.postal].filter(Boolean).join(', ')) + '</div>' : '')
      + '</div>'
      + '<div class="fld name-cell" data-label="Nafn">'
        + '<div>' + esc(r.name) + '</div>'
        + (r.email   ? '<div class="cell-sub">' + esc(r.email) + '</div>' : '')
        + (r.personKt ? '<div class="cell-kt-muted">' + esc(r.personKt) + '</div>' : '')
        + (r.phone   ? '<div class="cell-sub">' + esc(r.phone) + '</div>' : '')
      + '</div>'
      + '<div class="fld payment-cell hide-mobile" data-label="Greiðsla">'
        + paymentBadge(r.payment)
        + (r.billingInfo ? '<div class="cell-sub-mt">' + esc(r.billingInfo) + '</div>' : '')
      + '</div>'
      + '<div class="fld" data-label="BC staða">'
        + bcBadge(r.bcFound, r.bcWebshopActive)
        + (isPersonalKt(r.companyKt) ? '<br><span class="badge-person">Einstaklingur</span>' : '')
      + '</div>'
      + '<div class="fld hide-mobile score-cell" data-label="Skor">'
        + '<input class="score-input" id="score-' + i + '" type="number" min="1" max="10" placeholder="1-10" value="' + esc(r.creditScore) + '" onchange="onScoreChange(' + i + ')" />'
        + '<div id="score-badge-' + i + '">' + scoreBadge(r.creditScore) + '</div>'
      + '</div>'
      + '<div class="fld action-cell" data-label="Aðgerð">'
        + (r.bcFound
          ? '<button class="btn btn-ghost" onclick="confirmDone(' + i + ')">✓ Klárað</button>'
          : '<select class="template-select" id="tmpl-' + i + '">'
            + '<option value="">Velja…</option>'
            + '<option value="1">1 — Ekkert VSK-númer</option>'
            + '<option value="2" ' + (isPersonalKt(r.companyKt) ? 'selected' : '') + '>2 — Þarf lánshæfismat</option>'
            + '<option value="3">3 — Staðgreiðsla einungis</option>'
            + '</select>'
            + '<button class="btn btn-primary" onclick="confirmUmsokn(' + i + ')">Senda</button>'
          )
      + '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}


function confirmDone(i) {
  var r = appData.umsokn[i];
  var instructions = r.bcWebshopActive
    ? 'Bæta við Tengilið undir viðskiptavinaspjaldið í BC — syncast sjálfkrafa yfir í Magento.'
    : 'Kveikja á "Viðskiptamaður vefverslunar" toggle í BC og bæta við Tengilið — syncast sjálfkrafa yfir í Magento.';
  openModal(
    'Merkja sem klárað',
    instructions,
    '<strong>' + esc(r.company || r.email) + '</strong>' + (r.companyKt ? '<br><span class="cell-sub">' + esc(r.companyKt) + '</span>' : ''),
    function() {
      run('webapp_markUmsokn_Done', [{ rowIndex: r.rowIndex, email: r.email }])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('ums-row-' + i).remove();
            appData.umsokn[i]._done = true;
            var left = appData.umsokn.filter(function(x) { return x && !x._done; }).length;
            document.getElementById('badge-umsokn').textContent = left;
            notifyParentPending();
          }, 600);
          showToast(esc(r.company || r.email) + ' fært í "BC til - stofnað"');
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    },
    'Klárað'
  );
}

function confirmUmsokn(i) {
  var r = appData.umsokn[i];
  var sel = document.getElementById('tmpl-' + i);
  var tmpl = Number(sel.value);
  if (!tmpl) { showToast('Veldu template áður en þú sendir.', true); return; }
  var labels     = ['', 'Ekkert VSK-númer (hafnað)', 'Þarf lánshæfismat', 'Staðgreiðsla einungis'];
  var archiveIds = ['', 'novsk', 'needscredit', 'cashonly'];
  openModal(
    'Senda email — ' + labels[tmpl],
    'Sendir template ' + tmpl + ' á umsækjanda og flytur í "' + labels[tmpl] + '" flipa.',
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run('webapp_sendUmsokn_Email', [{ rowIndex: r.rowIndex, email: r.email, name: r.name }, tmpl])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('ums-row-' + i).remove();
            appData.umsokn[i]._done = true;
            var left = appData.umsokn.filter(function(x) { return x && !x._done; }).length;
            document.getElementById('badge-umsokn').textContent = left;
            notifyParentPending();
            }, 600);
          appData.umsokn.forEach(function(x) { if (x && x.rowIndex > r.rowIndex) x.rowIndex--; });
          showToast('Póstur sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Badges ─────────────────────────────────────────────────────────────────

function isPersonalKt(kt) {
  var s = String(kt).replace(/[^0-9]/g, '');
  return s.length === 10 && parseInt(s.substring(0, 2), 10) <= 31;
}

function scoreBadge(val) {
  var n = parseInt(val);
  if (!n || isNaN(n)) return '';
  if (n >= 6)  return '<span class="score-badge score-red">'    + n + '/10 — Staðgreiðsla</span>';
  if (n >= 4)  return '<span class="score-badge score-yellow">' + n + '/10 — Takmörkuð heimild</span>';
  return              '<span class="score-badge score-green">'  + n + '/10 — Heimild samþykkt</span>';
}

function onScoreChange(i) {
  var r   = appData.umsokn[i];
  var val = document.getElementById('score-' + i).value.trim();
  var n   = parseInt(val);

  // Update badge
  document.getElementById('score-badge-' + i).innerHTML = scoreBadge(val);

  // Auto-suggest template 3 if score 6-10
  if (n >= 6) {
    var sel = document.getElementById('tmpl-' + i);
    if (sel) sel.value = '3';
  }

  // Save to sheet
  if (val !== '') {
    run('webapp_saveCreditScore', [r.rowIndex, val])
      .catch(function(e) { showToast('Villa við vistun skors: ' + (e.message || e), true); });
  }
}

function bcBadge(found, webshopActive) {
  if (!found)        return '<span class="bc-notfound">— Ekki til í BC</span>';
  if (webshopActive) return '<span class="bc-found bc-web-active">✓ Til í BC — virkur á vef</span>';
  return '<span class="bc-found bc-web-inactive">✓ Til í BC — vefur óvirkur</span>';
}

function paymentBadge(p) {
  if (!p) return '—';
  if (p.toLowerCase().indexOf('reiknings') >= 0)
    return '<span class="pay-badge pay-badge--acc">Reikningur</span>';
  return '<span class="pay-badge pay-badge--cash">' + esc(p) + '</span>';
}

// ── Modal ──────────────────────────────────────────────────────────────────

var _modalCb = null;

function openModal(title, desc, info, cb, confirmLabel) {
  _modalCb = cb;
  document.getElementById('modal-title').textContent   = title;
  document.getElementById('modal-desc').textContent    = desc;
  document.getElementById('modal-info').innerHTML      = info;
  document.getElementById('modal-confirm').textContent = confirmLabel || 'Senda';
  document.getElementById('modal-confirm').onclick     = function() { closeModal(); cb(); };
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  _modalCb = null;
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Util ───────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Sync ───────────────────────────────────────────────────────────────────

function syncMagento() {
  var btn = document.getElementById('sync-btn');
  btn.disabled = true;
  btn.textContent = '⟳ Samstilli…';
  busy = true;
  run('syncMagentoCustomers')
    .then(function() { return run('webapp_pruneApplications'); })
    .then(function() {
      showToast('Samstilling lokið — hleð gögn að nýju');
      btn.disabled = false;
      btn.textContent = '⟳ Samstilla';
      busy = false;
      loadData();
    })
    .catch(function(e) {
      showToast('Villa við samstillingu: ' + (e.message || e), true);
      btn.disabled = false;
      btn.textContent = '⟳ Samstilla';
      busy = false;
    });
}

// ── Init + auto-refresh ──────────────────────────────────────────────────────

// Background poll for new applications. Skipped when the tab is hidden, a modal
// is open, or a long op (sync) is running — so it never interrupts an action.
var POLL_MS = 900000;  // 15 mín — ~10 umsóknir/dag; handvirkt Endurhlaða + focus-catch-up duga inn á milli
function canPoll() {
  return !document.hidden
    && !busy
    && !document.getElementById('modal').classList.contains('open');
}

loadData();
setInterval(function() { if (canPoll()) loadData(true); }, POLL_MS);

// Catch up immediately when the user returns to the tab.
document.addEventListener('visibilitychange', function() {
  if (canPoll()) loadData(true);
});
</script>
