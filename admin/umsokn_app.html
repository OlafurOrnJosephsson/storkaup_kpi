<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stórkaup — Umsóknir</title>
<style>
/* ── Brand tokens — speglar Webflow brand (--blue=#10069f o.s.frv.).
   Breyttu þema HÉR á einum stað. ── */
:root {
  --sk-blue:    #10069f;   /* Webflow --blue */
  --sk-blue-bg: #e8eaff;   /* blár blær (badge/pill bakgrunnur) */
  --sk-border:  #e9e9e9;   /* Webflow --light-gray-border */
  --sk-text:    #282828;   /* Webflow --black */
  --sk-muted:   #5b5b5b;   /* Webflow --black-700 */
  --sk-font:    "SF Pro Text", -apple-system, Arial, sans-serif;

  /* Standalone page frame (var transparent/full-bleed í iframe áður) */
  --sk-page-bg: #f4f5fa;   /* picked ljósgrár grunnur, hallar í --sk-blue */
  --sk-max:     1180px;    /* miðjuð hámarksbreidd — stilltu á einum stað */

  /* ── Stöðulitir (2026-08-06) ───────────────────────────────────────────
     Kortið á að segja hvað það vill áður en það er lesið: gult = ekki til í
     BC, þarf svarbréf. Grænt = til í BC, aðeins staðfesta. Sami litur er á
     kanti kortsins og á aðgerðareitnum, svo ástandið sést úr fjarlægð. */
  --sk-wait:      #b26a00;   /* bíður aðgerðar */
  --sk-wait-bg:   #fff5e1;
  --sk-wait-edge: #f0d9a8;
  --sk-wait-act:  #fffaf1;   /* aðgerðareitur */

  --sk-ready:      #2f7a46;  /* tilbúið til staðfestingar */
  --sk-ready-bg:   #eaf7ee;
  --sk-ready-edge: #bfe3cb;
  --sk-ready-act:  #f3faf5;

  --sk-flag:    #a33a55;     /* einstaklingskennitala */
  --sk-flag-bg: #fdeef2;
  --sk-flag-edge:#f3d3db;

  --sk-ink-3:   #868bac;     /* dauf merking — hallar í blátt, ekki hlutlaust grátt */
  --sk-edge-soft:#eff0f8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sk-font);
  font-size:18px;
  background: var(--sk-page-bg);
  color: var(--sk-text);
}

/* ── Tabs ── */
.tabs {
  background:transparent;
  border-bottom: 1px solid var(--sk-border);
  padding: 0;
  display: flex;
  gap: 0;
}
.tab {
  padding: 0 1rem;
  min-width: 220px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 400;
  display:flex; align-items:center;justify-content: center;
  height: 3rem;
  cursor: pointer;
  font-size: .75rem;
  font-weight: 400;
  color: var(--sk-text);
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: var(--sk-text); }
.tab.active { color: var(--sk-blue); border-bottom-color: var(--sk-blue); font-weight: 500; }
.tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #f0f0f0;
  color: var(--sk-muted);
  font-size: 0.625rem;
  font-weight: 400;
  height: 1.25rem;
  width: 1.25rem;
  border-radius: 50%;
  margin-left: 6px;
  vertical-align: middle;
}
.tab.active .tab-badge { background: var(--sk-blue-bg); color: var(--sk-blue);font-weight:500; }

/* ── Content ── */
.content { max-width: var(--sk-max); margin: 0 auto; padding: 24px 32px; }

/* ── Loading ── */
.loading {
  display: flex;
  align-items: center;
  gap: .75rem;
  color: var(--sk-muted);
  padding: 3rem 0;
}
.spinner {
  width: 1.5rem; height:1.5rem;
  border: 2px solid var(--sk-border);
  border-top-color: var(--sk-blue);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 48px 0;
  color: var(--sk-muted);
}
.empty-icon { font-size: 32px; margin-bottom: 8px; }
.empty p { font-size: 13px; }

/* ── Cards ── rows render as cards at ALL widths (no visual table).
   Label comes from td[data-label]; desktop = "label | value" grid, mobile stacks. */
.card-list {                     /* fyllir breiddina, jafnar hæð innan raðar */
  display: grid;
  gap: 1.125rem;
  grid-template-columns: repeat(auto-fill, minmax(27rem, 1fr));
  align-items: stretch;
}
.card {
  border: 1px solid var(--sk-border);
  border-radius: 0.875rem;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(16,6,159,.04), 0 6px 18px -12px rgba(16,6,159,.22);
  /* Flex-dálkur svo meginmálið taki slakann og aðgerðareiturinn lendi alltaf
     neðst — annars stiga hnapparnir upp og niður eftir efnismagni. */
  display: flex;
  flex-direction: column;
  min-height: 16rem;
  transition: box-shadow .18s ease, opacity .4s ease;
}
.card:hover { box-shadow: 0 1px 2px rgba(16,6,159,.05), 0 10px 26px -14px rgba(16,6,159,.3); }
.card.done { opacity: 0.35; }

/* Ástandið er á kortinu sjálfu, ekki falið í pillu í miðju eyðublaði. */
.card.st-wait  { border-top: 3px solid var(--sk-wait); }
.card.st-ready { border-top: 3px solid var(--sk-ready); }

/* ── Kortahaus: auðkenni + staða ── */
.uc-head { padding: .9rem 1.05rem .8rem; display: grid; gap: .55rem; }
.uc-id   { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
.uc-co   { font-size: 1.15rem; font-weight: 700; letter-spacing: -.012em; line-height: 1.2; text-wrap: balance; }
.uc-when { font-size: .75rem; color: var(--sk-ink-3); white-space: nowrap; padding-top: .25rem; }
.uc-chips{ display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }

/* ── Meginmál: tveir dálkar í hljóðlátari register ── */
.uc-body {
  border-top: 1px solid var(--sk-edge-soft);
  padding: .8rem 1.05rem .9rem;
  display: grid; grid-template-columns: 1fr 1fr; gap: .8rem 1.25rem;
  flex: 1 1 auto; align-content: start;
}
.uc-f  { min-width: 0; }
.uc-k  {
  font-size: .5rem; font-weight: 600; letter-spacing: .4px;
  text-transform: uppercase; color: var(--sk-muted); margin-bottom: .2rem;
}
.uc-v  { font-size: .78rem; line-height: 1.5; color: var(--sk-muted); overflow-wrap: anywhere; }
.uc-v strong { color: var(--sk-text); font-weight: 600; }
.uc-v .tel { font-family: monospace; letter-spacing: .02em; }
.uc-ktlink {
  font-family: monospace; color: var(--sk-blue); text-decoration: none;
  border-bottom: 1px solid #c9cce8; padding-bottom: 1px;
}
.uc-ktlink:hover { border-bottom-color: var(--sk-blue); }

/* ── Aðgerðareitur: litaður eftir stöðu ── */
.uc-act {
  display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  padding: .75rem 1.05rem; border-top: 1px solid var(--sk-edge-soft);
}
.uc-act.st-wait  { background: var(--sk-wait-act); }
.uc-act.st-ready { background: var(--sk-ready-act); }
.uc-act .uc-k    { margin-bottom: 0; }
.uc-hint {
  flex: 1 1 100%; font-size: .72rem; line-height: 1.45; color: var(--sk-muted);
}
.uc-hint strong { color: var(--sk-text); }

.fld {                           /* value sits UNDER its label heading */
  padding: 0.5rem 0;
  font-size:.875rem;
  border-bottom: 1px solid #f2f2f2;
}
.fld:first-child { padding-top: 0; }
.fld:last-child  { border-bottom: none; padding-bottom: 0; }
.fld::before {
  content: attr(data-label);
  display: block;
  margin-bottom: 0.375rem;
  font-size: 0.5rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--sk-muted);
}
.company-cell,
.cell-sub,
.cell-kt-muted,
.cell-kt,
.cell-sub-mt,
.payment-cell,
.date-cell
{ font-size: .75rem;line-height:1rem;}

.company-cell { font-weight: 500;}
.date-cell { color: var(--sk-muted);  white-space: nowrap;}
.kt-cell { color: var(--sk-muted);  font-family: monospace; }
.email-cell { color: var(--sk-muted);}
.payment-cell { font-size: 12px; }
.cell-kt{color: var(--sk-blue); font-weight:600;font-family: monospace; text-decoration: none; }

/* ── Merki (BC-staða, greiðsla, einstaklingur) ──
   Sama form á öllum svo hausinn lesist sem ein lína af stöðu. */
.bc-found, .bc-notfound, .pay-badge, .badge-person {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .72rem; font-weight: 700; letter-spacing: .03em;
  padding: 3px 9px; border-radius: 7px;
  border: 1px solid transparent; white-space: nowrap;
}
.bc-found    { background: var(--sk-ready-bg); color: var(--sk-ready); border-color: var(--sk-ready-edge); }
.bc-notfound { background: var(--sk-wait-bg);  color: var(--sk-wait);  border-color: var(--sk-wait-edge); }
.badge-person{ background: var(--sk-flag-bg);  color: var(--sk-flag);  border-color: var(--sk-flag-edge); }
.pay-badge   { background: var(--sk-blue-bg);  color: var(--sk-blue);  border-color: #d9dcfb; }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  flex-direction:row;
  align-items: center;
  height: 32px;
  padding: 0 1rem;
  border-radius: .5rem;
  font-size: .875rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: opacity 0.3s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--sk-blue); color: #fff; }
.btn-ghost {
  background: #f5f5f5; color: var(--sk-text);
  border: 1px solid var(--sk-border);
}

/* ── Credit score input ── */
.score-input {
  width: 58px;
  height:32px;
  padding: 0 .5rem;
  border: 1px solid var(--sk-border);
  border-radius: .5rem;
  font-size: 13px;
  text-align: center;
  background: #fff;
}
.score-input:focus { outline: 1px solid var(--sk-blue); }
.score-badge {
  display: inline-block;
  font-size: .625rem;
  font-weight: 600;
  padding: .25rem .5rem;
  border-radius: .25rem;
  margin-top: .5rem;
}
.score-red    { background: #f8d7da; color: #721c24; }
.score-yellow { background: #fff3cd; color: #856404; }
.score-green  { background: #d4edda; color: #155724; }

/* ── Template dropdown ── */
.action-cell { white-space: nowrap; }
.template-select {
  font-size: .75rem;
  padding: 0 .5rem;
  border: 1px solid var(--sk-border);
  border-radius: .5rem;
  background: #fff;
  color: var(--sk-text);
  cursor: pointer;
  margin-right:1rem;
  height:32px;
}
.template-select:focus { outline: 2px solid var(--sk-blue); }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 1rem;
  padding: 2rem;
  max-width: 440px;
  width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal h3 { font-size: 16px; margin-bottom: 12px; }
.modal p { color: #444; line-height: 1.6; margin-bottom: 6px; font-size: 13px; }
.modal-info {
  background: #f5f6ff;
  border: 1px solid var(--sk-border);
  border-radius: .5rem;
  padding: 1rem;
  margin: 14px 0;
  font-size: .75rem;
}
.modal-info strong { display: block; font-size: .75rem; margin-bottom: .25rem; }
.modal-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--sk-text);
  color: #fff;
  padding: 1rem;
  border-radius: 8px;
  font-size: .625rem;
  font-weight: 500;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.25s;
  z-index: 200;
  max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { background: #c23340; }

/* ── BC badge variants ── */
.bc-web-inactive { background: #fff3cd; color: #856404; }
.bc-web-active   { background: #d4edda; color: #155724; }

/* ── Cell sub-content, badges, header (used by the generated rows) ── */

.badge-person   { display: inline-block; margin-top: 4px; background: #fff3cd; color: #856404; font-size: .5rem; font-weight: 600; padding: 3px 8px; border-radius: .25rem; }
.pay-badge      { padding: 2px 8px; border-radius: 4px; font-size: .625rem; font-weight: 600; }
.pay-badge--acc  { background: var(--sk-blue-bg); color: var(--sk-blue); }
.pay-badge--cash { background: #f0f0f0; color: #555; }
.score-cell     { white-space: nowrap; }
.err-text       { color: #c23340; }

.app-header           { border-bottom: 1px solid var(--sk-border); background: #fff; }
.app-inner            { max-width: var(--sk-max); margin: 0 auto; padding: 0 32px; }
.app-header__row      { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

/* Merkið sjálft í stað "STÓRKAUP · UMSÓKNIR" í hástöfum. Litirnir eru
   innbyggðir í SVG-ið (blátt #10069f, rauða strikið #eb0042) — ekkert hér
   litar það, svo merkið helst rétt óháð þema. */
.app-mark             { display: flex; align-items: center; padding: 13px 0 11px; flex: 0 0 auto; }
.app-mark svg         { height: 36px; width: auto; display: block; }

.app-header .tabs     { border-bottom: none; margin-left: 26px; margin-right: auto; min-width: 0; }
.app-header__actions  { display: flex; align-items: center; gap: 9px; flex-shrink: 0; padding-bottom: 11px; }
.refresh-status       { font-size: .68rem; color: var(--sk-ink-3); white-space: nowrap; transition: color .3s ease; }
.refresh-status.flash { color: var(--sk-ready); }

/* ── Hausahnappar ──
   Hreyfing sem segir til um stöðu, aldrei skraut: snúningur þýðir að eitthvað
   er í gangi. Sækja-aftur fær einn ákveðinn snúning (stutt verk — spinner sem
   blikkar í 200ms les eins og galli); Samstilla fær samfelldan snúning því hún
   tekur tugi sekúnda, og heldur staðfestingu í tvær sekúndur áður en hún
   fer í hvíld. */
.icon-btn, .sync-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; border-radius: .5rem; cursor: pointer;
  border: 1px solid var(--sk-border); background: #fff; color: var(--sk-text);
  font-family: inherit; font-size: .8rem; font-weight: 600;
  transition: background-color .16s ease, border-color .16s ease,
              box-shadow .16s ease, transform .1s ease, color .16s ease;
}
.icon-btn { width: 36px; padding: 0; }
.sync-btn { padding: 0 15px; }
.icon-btn:hover, .sync-btn:hover {
  background: #f7f8fd; border-color: #d6d9ea;
  box-shadow: 0 2px 6px -2px rgba(16,6,159,.18);
}
.icon-btn:active, .sync-btn:active { transform: translateY(1px); box-shadow: none; }
.icon-btn:focus-visible, .sync-btn:focus-visible { outline: 2px solid var(--sk-blue); outline-offset: 2px; }
.icon-btn svg, .sync-btn svg { width: 16px; height: 16px; display: block; }

.icon-btn.busy svg, .sync-btn.busy svg { animation: spin .75s linear infinite; }
.icon-btn.turn svg { animation: spin .55s cubic-bezier(.3,.9,.3,1); }
.sync-btn[disabled] { cursor: default; color: var(--sk-muted); }
.sync-btn.ok { background: var(--sk-ready-bg); border-color: var(--sk-ready-edge); color: var(--sk-ready); }

@media (prefers-reduced-motion: reduce) {
  .icon-btn svg, .sync-btn svg { animation: none !important; }
  .card, .icon-btn, .sync-btn, .tab { transition-duration: .01ms !important; }
}

/* ── Mobile: header stacks, cards go single-column ── */
@media (max-width: 768px) {
  .content { padding: 0.75rem; }

  /* Header stacks: tabs full width, actions in a row below */
  .app-inner { padding: 0 0.75rem; }
  .app-header__row { flex-direction: column; align-items: stretch; gap: 0; padding-right: 0; }
  .app-header .tabs { width: 100%; }
  .tab {
    min-width: 0; flex: 1 1 0;
    font-size: 0.8rem; line-height: 1.2;
    padding: 0.5rem 0.375rem; height: auto; min-height: 3rem;
    text-align: center;
  }
  .tab .tab-badge { margin-left: 0.3rem; }
  .app-header__actions { justify-content: flex-end; gap: 0.5rem; padding: 1rem; flex-wrap: wrap; }
  .refresh-status { margin-right: auto; }

  .hide-mobile { display: none !important; }

  /* Eitt kort á breidd, og reitirnir tveir staflast */
  .card-list { grid-template-columns: 1fr; gap: .875rem; }
  .uc-body   { grid-template-columns: 1fr; }
  .app-mark  { padding: 10px 0 6px; }
  .app-mark svg { height: 30px; }
  .app-header .tabs { margin-left: 0; width: 100%; }

  /* Aðgerðir fylla breiddina — þægileg snertimörk */
  .uc-act .template-select { width: 100%; max-width: none; height: 2.625rem; font-size: 0.875rem; }
  .uc-act .btn { width: 100%; font-size: 0.875rem; }
  .score-input { width: 4rem; height: 2.375rem; font-size: 0.875rem; }
}
</style>
</head>

          Rafræn Innskráning <span class="tab-badge" id="badge-rafraen">0</span>
        </div>
        <div class="tab active" data-tab="umsokn" onclick="switchTab('umsokn')">
          Umsókn um viðskipti <span class="tab-badge" id="badge-umsokn">0</span>
        </div>
      </div>
      <div class="app-header__actions">
        <span id="refresh-status" class="refresh-status"></span>
        <button class="icon-btn" id="refresh-btn" onclick="spinRefreshIcon();loadData(false)" title="Sækja aftur" aria-label="Sækja aftur">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.2V10h-5.8"/>
          </svg>
        </button>
        <button class="sync-btn" id="sync-btn" onclick="syncMagento()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 0 1 14.3-6.2L20.5 8"/><path d="M20.5 3.2V8h-4.8"/>
            <path d="M20.5 12a8.5 8.5 0 0 1-14.3 6.2L3.5 16"/><path d="M3.5 20.8V16h4.8"/>
          </svg>
          <span id="sync-label">Samstilla</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="content">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Sæki umsóknir og athugar BC stöðu…</span>
  </div>

  <div id="tab-rafraen"     class="tab-content" style="display:none;"></div>
  <div id="tab-umsokn"      class="tab-content" style="display:none;"></div>
</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-title">Staðfesta</h3>
    <p id="modal-desc"></p>
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Hætta við</button>
      <button class="btn btn-primary" id="modal-confirm">Senda</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var appData = null;

// ── Helpers ────────────────────────────────────────────────────────────────

function run(fn, args) {
  return new Promise(function(resolve, reject) {
    var call = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    call[fn].apply(call, args || []);
  });
}

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return iso.substring(8,10) + '.' + iso.substring(5,7) + '.' + iso.substring(2,4);
}

// ── Tabs ───────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.tab-content').forEach(function(c) {
    c.style.display = c.id === 'tab-' + name ? '' : 'none';
  });
}

// Re-apply the currently active tab — used after (re)rendering so a refresh/poll
// keeps the tabs separated instead of showing both tab contents at once.
function applyActiveTab() {
  var t = document.querySelector('.tab.active');
  switchTab(t ? t.dataset.tab : 'umsokn');
}

// ── Load data ──────────────────────────────────────────────────────────────

var lastDataSig = null;   // signature of last rendered data — skip re-render when unchanged
var busy = false;         // a long op (Magento sync) is running — pause polling

function fmtClock(d) {
  return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
function setRefreshStatus(text) {
  var el = document.getElementById('refresh-status');
  if (!el) return;
  el.textContent = text || '';
  if (!text) return;
  el.classList.add('flash');          // grænt blikk svo uppfærslan sjáist
  setTimeout(function() { el.classList.remove('flash'); }, 900);
}

// Sækja-aftur: einn ákveðinn snúningur. Stutt verk fá hreyfingu, ekki spinner.
function spinRefreshIcon() {
  var b = document.getElementById('refresh-btn');
  if (!b || b.classList.contains('turn')) return;
  b.classList.add('turn');
  setTimeout(function() { b.classList.remove('turn'); }, 560);
}

// Símanúmer koma úr forminu á ýmsu formi (+354 862 5014, 3548625014, bil og
// bandstrik). Innanlandsapp þarf ekki landsnúmerið — sýnum hreina tölu.
function fmtTel(raw) {
  var d = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
  if (d.length > 7 && d.indexOf('354') === 0) d = d.substring(3);
  return d;
}

// silent=true → background poll: no spinner, and only re-render if the data
// actually changed (avoids flicker / scroll jumps while the user is reading).
// Tell the embedding Webflow page the current pending total so the nav badge
// updates instantly (no refresh). Reads the live tab badges — accurate after
// both a data load and an optimistic action removal.
function notifyParentPending() {
  try {
    if (!window.parent || window.parent === window) return;
    var raf = parseInt((document.getElementById('badge-rafraen') || {}).textContent, 10) || 0;
    var ums = parseInt((document.getElementById('badge-umsokn') || {}).textContent, 10) || 0;
    window.parent.postMessage({ type: 'storkaup:pending', total: raf + ums }, '*');
  } catch (e) {}
}

function loadData(silent) {
  if (!silent) document.getElementById('loading').style.display = '';
  setRefreshStatus(silent ? '' : 'Sæki…');
  return run('webapp_getApplications').then(function(data) {
    var sig = JSON.stringify(data);
    var changed = sig !== lastDataSig;
    lastDataSig = sig;
    appData = data;
    document.getElementById('loading').style.display = 'none';
    if (changed || !silent) {
      renderRafraen(data.rafraen || []);
      renderUmsokn(data.umsokn  || []);
    }
    applyActiveTab();
    setRefreshStatus('Uppfært ' + fmtClock(new Date()));
    if (silent && changed) showToast('Listinn uppfærður — nýjar/breyttar umsóknir');
    notifyParentPending();
  }).catch(function(err) {
    if (!silent) {
      document.getElementById('loading').innerHTML =
        '<span class="err-text">Villa við að sækja gögn: ' + (err.message || err) + '</span>';
    }
    setRefreshStatus('Villa við uppfærslu');
  });
}

// ── Render Rafræn ──────────────────────────────────────────────────────────

function renderRafraen(rows) {
  document.getElementById('badge-rafraen').textContent = rows.length;
  var el = document.getElementById('tab-rafraen');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Rafræn Innskráningu.</p></div>';
    return;
  }
  var html = '<div class="card-list">';
  rows.forEach(function(r, i) {
    var st  = r.bcFound ? 'ready' : 'wait';
    var tel = fmtTel(r.phone);
    var showPersonKt = r.personKt && String(r.personKt).replace(/\D/g,'') !== String(r.companyKt || '').replace(/\D/g,'');

    html += '<div class="card st-' + st + '" id="raf-row-' + i + '">'

      + '<div class="uc-head">'
        + '<div class="uc-id">'
          + '<div class="uc-co">' + esc(r.company || r.name || '—') + '</div>'
          + '<div class="uc-when">' + fmtDate(r.date) + '</div>'
        + '</div>'
        + '<div class="uc-chips">'
          + bcBadge(r.bcFound, r.bcWebshopActive)
          + (isPersonalKt(r.companyKt) ? '<span class="badge-person">Einstaklingur</span>' : '')
        + '</div>'
      + '</div>'

      + '<div class="uc-body">'
        + '<div class="uc-f"><div class="uc-k">Tengiliður</div><div class="uc-v">'
          + '<strong>' + esc(r.name || '—') + '</strong>'
          + (r.email ? '<br>' + esc(r.email) : '')
          + (tel ? '<br><span class="tel">' + esc(tel) + '</span>' : '')
          + (showPersonKt ? (tel ? ' · ' : '<br>') + '<span class="tel">' + esc(r.personKt) + '</span>' : '')
        + '</div></div>'
        + '<div class="uc-f"><div class="uc-k">Fyrirtæki</div><div class="uc-v">'
          + (r.companyKt
              ? '<a class="uc-ktlink" target="_blank" rel="noopener" href="https://www.skatturinn.is/fyrirtaekjaskra/leit/kennitala/'
                + esc(r.companyKt) + '">' + esc(r.companyKt) + '</a>'
              : '<span style="color:var(--sk-ink-3)">Engin kennitala skráð</span>')
        + '</div></div>'
      + '</div>'

      + '<div class="uc-act st-' + st + '">'
        + '<select class="template-select" id="raf-tmpl-' + i + '">'
          + '<option value="">Velja aðgerð…</option>'
          + '<option value="redirect">Senda redirect</option>'
          + '<option value="needkt">Vantar persónulega kt</option>'
        + '</select>'
        + '<button class="btn btn-primary" onclick="confirmRafraen(' + i + ')">Senda</button>'
      + '</div>'

      + '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function confirmRafraen(i) {
  var r = appData.rafraen[i];
  var sel = document.getElementById('raf-tmpl-' + i);
  var action = sel ? sel.value : '';
  if (!action) { showToast('Veldu aðgerð áður en þú sendir.', true); return; }

  var ACTIONS = {
    redirect: {
      fn: 'webapp_sendRafraenRedirect',
      title: 'Senda redirect póst',
      desc: 'Sendir á umsækjanda og flytur línu í "Framsent" flipa.'
    },
    needkt: {
      fn: 'webapp_sendRafraenNeedKt',
      title: 'Vantar persónulega kennitölu',
      desc: 'Sendir póst sem biður umsækjanda að skrá sig aftur með persónulegri kennitölu, og flytur línu í "Vantar kennitölu" flipa.'
    }
  };
  var a = ACTIONS[action];
  if (!a) return;

  openModal(
    a.title,
    a.desc,
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run(a.fn, [{ rowIndex: r.rowIndex, email: r.email, name: r.name, company: r.company, companyKt: r.companyKt }])
        .then(function() {
          document.getElementById('raf-row-' + i).classList.add('done');
          setTimeout(function() {
            var el = document.getElementById('raf-row-' + i);
            if (el) el.remove();
            var left = document.querySelectorAll('#tab-rafraen .card:not(.done)').length;
            document.getElementById('badge-rafraen').textContent = left;
            notifyParentPending();
          }, 600);
          showToast('Póstur sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Render Umsókn ──────────────────────────────────────────────────────────

function renderUmsokn(rows) {
  document.getElementById('badge-umsokn').textContent = rows.length;
  var el = document.getElementById('tab-umsokn');
  if (!rows.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✓</div><p>Engar ómeðhöndlaðar umsóknir í Umsókn um viðskipti.</p></div>';
    return;
  }
  var html = '<div class="card-list">';
  rows.forEach(function(r, i) {
    var personal = isPersonalKt(r.companyKt);
    var st       = r.bcFound ? 'ready' : 'wait';
    // Kennitala einstaklings er falin þegar hún er sú sama og kennitala
    // fyrirtækisins — "Einstaklingur"-merkið segir það þegar, og að endurtaka
    // töluna er hávaði.
    var showPersonKt = r.personKt && String(r.personKt).replace(/\D/g,'') !== String(r.companyKt).replace(/\D/g,'');
    var tel  = fmtTel(r.phone);
    var addr = [r.address, r.city, r.postal].filter(Boolean).join(', ');

    html += '<div class="card st-' + st + '" id="ums-row-' + i + '">'

      + '<div class="uc-head">'
        + '<div class="uc-id">'
          + '<div class="uc-co">' + esc(r.company || r.name || '—') + '</div>'
          + '<div class="uc-when">' + fmtDate(r.date) + '</div>'
        + '</div>'
        + '<div class="uc-chips">'
          + bcBadge(r.bcFound, r.bcWebshopActive)
          + (personal ? '<span class="badge-person">Einstaklingur</span>' : '')
          + paymentBadge(r.payment)
        + '</div>'
      + '</div>'

      + '<div class="uc-body">'
        + '<div class="uc-f"><div class="uc-k">Tengiliður</div><div class="uc-v">'
          + '<strong>' + esc(r.name || '—') + '</strong>'
          + (r.email ? '<br>' + esc(r.email) : '')
          + (tel ? '<br><span class="tel">' + esc(tel) + '</span>' : '')
          + (showPersonKt ? (tel ? ' · ' : '<br>') + '<span class="tel">' + esc(r.personKt) + '</span>' : '')
        + '</div></div>'
        + '<div class="uc-f"><div class="uc-k">Fyrirtæki</div><div class="uc-v">'
          + (r.companyKt
              ? '<a class="uc-ktlink" target="_blank" rel="noopener" href="https://www.skatturinn.is/fyrirtaekjaskra/leit/kennitala/'
                + esc(r.companyKt) + '">' + esc(r.companyKt) + '</a>'
              : '')
          + (r.companyEmail ? (r.companyKt ? '<br>' : '') + esc(r.companyEmail) : '')
          + (addr ? '<br>' + esc(addr) : '')
          + (r.billingInfo ? '<br>' + esc(r.billingInfo) : '')
        + '</div></div>'
      + '</div>'

      + '<div class="uc-act st-' + st + '">'
        + (r.bcFound
          ? '<button class="btn btn-primary" onclick="confirmDone(' + i + ')">✓ Klárað</button>'
            + '<div class="uc-hint">Kveikja á <strong>Viðskiptamaður vefverslunar</strong> í BC og bæta við tengilið — syncast sjálfkrafa í Magento.</div>'
          : '<span class="uc-k">Skor</span>'
            + '<input class="score-input" id="score-' + i + '" type="number" min="1" max="10" placeholder="1-10" value="' + esc(r.creditScore) + '" onchange="onScoreChange(' + i + ')" />'
            + '<select class="template-select" id="tmpl-' + i + '">'
              + '<option value="">Velja svarbréf…</option>'
              + '<option value="1">1 — Ekkert VSK-númer</option>'
              + '<option value="2" ' + (personal ? 'selected' : '') + '>2 — Þarf lánshæfismat</option>'
              + '<option value="3">3 — Staðgreiðsla einungis</option>'
            + '</select>'
            + '<button class="btn btn-primary" onclick="confirmUmsokn(' + i + ')">Senda</button>'
            // Aðskilið frá skor-merkinu: onScoreChange skrifar yfir #score-badge,
            // og þá mátti skýringin um einstaklingskennitölu ekki hverfa með.
            + (personal ? '<div class="uc-hint">Einstaklingskennitala — svarbréf 2 valið sjálfkrafa.</div>' : '')
            + '<div class="uc-hint" id="score-badge-' + i + '">' + scoreBadge(r.creditScore) + '</div>'
          )
      + '</div>'

      + '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}


function confirmDone(i) {
  var r = appData.umsokn[i];
  var instructions = r.bcWebshopActive
    ? 'Bæta við Tengilið undir viðskiptavinaspjaldið í BC — syncast sjálfkrafa yfir í Magento.'
    : 'Kveikja á "Viðskiptamaður vefverslunar" toggle í BC og bæta við Tengilið — syncast sjálfkrafa yfir í Magento.';
  openModal(
    'Merkja sem klárað',
    instructions,
    '<strong>' + esc(r.company || r.email) + '</strong>' + (r.companyKt ? '<br><span class="cell-sub">' + esc(r.companyKt) + '</span>' : ''),
    function() {
      run('webapp_markUmsokn_Done', [{ rowIndex: r.rowIndex, email: r.email, companyKt: r.companyKt }])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('ums-row-' + i).remove();
            appData.umsokn[i]._done = true;
            var left = appData.umsokn.filter(function(x) { return x && !x._done; }).length;
            document.getElementById('badge-umsokn').textContent = left;
            notifyParentPending();
          }, 600);
          showToast(esc(r.company || r.email) + ' fært í "BC til - stofnað"');
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    },
    'Klárað'
  );
}

function confirmUmsokn(i) {
  var r = appData.umsokn[i];
  var sel = document.getElementById('tmpl-' + i);
  var tmpl = Number(sel.value);
  if (!tmpl) { showToast('Veldu template áður en þú sendir.', true); return; }
  var labels     = ['', 'Ekkert VSK-númer (hafnað)', 'Þarf lánshæfismat', 'Staðgreiðsla einungis'];
  var archiveIds = ['', 'novsk', 'needscredit', 'cashonly'];
  openModal(
    'Senda email — ' + labels[tmpl],
    'Sendir template ' + tmpl + ' á umsækjanda og flytur í "' + labels[tmpl] + '" flipa.',
    '<strong>' + esc(r.name || r.email) + '</strong>' + esc(r.company ? ' — ' + r.company : '') + '<br>' + esc(r.email),
    function() {
      run('webapp_sendUmsokn_Email', [{ rowIndex: r.rowIndex, email: r.email, name: r.name, companyKt: r.companyKt }, tmpl])
        .then(function() {
          document.getElementById('ums-row-' + i).classList.add('done');
          setTimeout(function() {
            document.getElementById('ums-row-' + i).remove();
            appData.umsokn[i]._done = true;
            var left = appData.umsokn.filter(function(x) { return x && !x._done; }).length;
            document.getElementById('badge-umsokn').textContent = left;
            notifyParentPending();
            }, 600);
          appData.umsokn.forEach(function(x) { if (x && x.rowIndex > r.rowIndex) x.rowIndex--; });
          showToast('Póstur sendur til ' + r.email);
        })
        .catch(function(e) { showToast('Villa: ' + (e.message || e), true); });
    }
  );
}

// ── Badges ─────────────────────────────────────────────────────────────────

function isPersonalKt(kt) {
  var s = String(kt).replace(/[^0-9]/g, '');
  return s.length === 10 && parseInt(s.substring(0, 2), 10) <= 31;
}

function scoreBadge(val) {
  var n = parseInt(val);
  if (!n || isNaN(n)) return '';
  if (n >= 6)  return '<span class="score-badge score-red">'    + n + '/10 — Staðgreiðsla</span>';
  if (n >= 4)  return '<span class="score-badge score-yellow">' + n + '/10 — Takmörkuð heimild</span>';
  return              '<span class="score-badge score-green">'  + n + '/10 — Heimild samþykkt</span>';
}

function onScoreChange(i) {
  var r   = appData.umsokn[i];
  var val = document.getElementById('score-' + i).value.trim();
  var n   = parseInt(val);

  // Update badge
  document.getElementById('score-badge-' + i).innerHTML = scoreBadge(val);

  // Auto-suggest template 3 if score 6-10
  if (n >= 6) {
    var sel = document.getElementById('tmpl-' + i);
    if (sel) sel.value = '3';
  }

  // Save to sheet
  if (val !== '') {
    run('webapp_saveCreditScore', [r.rowIndex, val])
      .catch(function(e) { showToast('Villa við vistun skors: ' + (e.message || e), true); });
  }
}

function bcBadge(found, webshopActive) {
  if (!found)        return '<span class="bc-notfound">— Ekki til í BC</span>';
  if (webshopActive) return '<span class="bc-found bc-web-active">✓ Til í BC — virkur á vef</span>';
  return '<span class="bc-found bc-web-inactive">✓ Til í BC — vefur óvirkur</span>';
}

function paymentBadge(p) {
  if (!p) return '—';
  if (p.toLowerCase().indexOf('reiknings') >= 0)
    return '<span class="pay-badge pay-badge--acc">Reikningur</span>';
  return '<span class="pay-badge pay-badge--cash">' + esc(p) + '</span>';
}

// ── Modal ──────────────────────────────────────────────────────────────────

var _modalCb = null;

function openModal(title, desc, info, cb, confirmLabel) {
  _modalCb = cb;
  document.getElementById('modal-title').textContent   = title;
  document.getElementById('modal-desc').textContent    = desc;
  document.getElementById('modal-info').innerHTML      = info;
  document.getElementById('modal-confirm').textContent = confirmLabel || 'Senda';
  document.getElementById('modal-confirm').onclick     = function() { closeModal(); cb(); };
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  _modalCb = null;
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Util ───────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Sync ───────────────────────────────────────────────────────────────────

function syncMagento() {
  var btn   = document.getElementById('sync-btn');
  var label = document.getElementById('sync-label');
  btn.disabled = true;
  btn.classList.remove('ok');
  btn.classList.add('busy');          // samfelldur snúningur meðan unnið er
  label.textContent = 'Samstilli…';
  busy = true;

  // Staðfestingin er höfð uppi í tvær sekúndur áður en hnappurinn fer í hvíld —
  // blikk sem varir 200ms sést ekki, og þá veit notandinn ekki hvort tókst.
  function reset() {
    btn.classList.remove('busy');
    btn.classList.add('ok');
    label.textContent = 'Samstillt';
    busy = false;
    setTimeout(function() {
      btn.classList.remove('ok');
      label.textContent = 'Samstilla';
      btn.disabled = false;
    }, 1900);
  }

  // Sync er aðeins fersk-hleðsla á Magento-viðskiptavinum; hourly
  // scheduledMagentoSync_v1 heldur sheetinu fersku hvort eð er. Þess vegna má
  // prune (sem færir afgreiddar umsóknir í LOKID) EKKI stranda þó sync klikki —
  // annars sitja umsóknir fastar við tímabundna Magento-hnökk. Prune keyrir alltaf.
  var syncErr = null;
  run('syncMagentoCustomers')
    .catch(function(e) { syncErr = e; })
    .then(function() { return run('webapp_pruneApplications'); })
    .then(function() {
      if (syncErr) {
        showToast('Magento-samstilling mistókst (' + (syncErr.message || syncErr) + ') — hreinsaði samt afgreiddar umsóknir', true);
      } else {
        showToast('Samstilling lokið — hleð gögn að nýju');
      }
      reset();
      loadData();
    })
    .catch(function(e) {
      showToast('Villa við samstillingu: ' + (e.message || e), true);
      reset();
    });
}

// ── Init + auto-refresh ──────────────────────────────────────────────────────

// Background poll for new applications. Skipped when the tab is hidden, a modal
// is open, or a long op (sync) is running — so it never interrupts an action.
var POLL_MS = 900000;  // 15 mín — ~10 umsóknir/dag; handvirkt Endurhlaða + focus-catch-up duga inn á milli
function canPoll() {
  return !document.hidden
    && !busy
    && !document.getElementById('modal').classList.contains('open');
}

loadData();
setInterval(function() { if (canPoll()) loadData(true); }, POLL_MS);

// Catch up immediately when the user returns to the tab.
document.addEventListener('visibilitychange', function() {
  if (canPoll()) loadData(true);
});
</script>
</body>
